# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- dependabot/npm_and_yarn/bcrypt-5.0.0

pool:
  vmImage: ubuntu-latest


stages :
  - stage: example
    jobs:
    - job: ASoC_Scan
      steps:
      - task: HCLAppScanOnCloud@2
        continueOnError: true
        inputs:
          AppSecTestService: 'ASoC'
          applications: '93704532-4ae4-4148-9af3-44e8111c492a'
          scantype: 'static'
          scanMethod: 'IRX'
          includeSCA: false
          ScanSpeedOptions: 'simple'
          FailBuildConfiguration: true
      - task: Bash@3
        displayName: 'Example PR Comment'
        inputs:
          targetType: 'inline'
          script: |
            COMMENT=$(echo "Test PR comment from Azure DevOps Pipeline")
            
            ADO_API=$(echo "$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.Name)/pullRequests/1/threads?api-version=7.1-preview.1")
            echo $ADO_API
            echo $(System.PullRequest.PullRequestId)
            PR_COMMENT=$(jq --arg comment "$COMMENT" '.comments[0].content = $comment' <<< '{"comments": [{"parentCommentId": 0,"content": "","commentType": 1}],"status": 1}')

            curl --request POST "$ADO_API" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
            --data "$PR_COMMENT" \
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

