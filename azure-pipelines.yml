# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- dependabot/npm_and_yarn/bcrypt-5.0.0

pool:
  vmImage: ubuntu-latest

steps:
- powershell: |
      Write-Host $env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI
      Write-Host $env:SYSTEM_TEAMPROJECTID
      Write-Host $env:BUILD_REPOSITORY_NAME
      Write-Host $env:System_PullRequest_PullRequestId
      $ADO_API=$(echo "$($env:System.CollectionUri)$($env:System.TeamProject)/_apis/git/repositories/$($env:Build.Repository.Name)/pullRequests/$($env:System.PullRequest.PullRequestId)/threads?api-version=7.1-preview.1")
      Write-Host $ADO_API
      $Body = @"
      {
          "comments": [
            {
              "parentCommentId": 0,
              "content": "Your comment here",
              "commentType": 1
            }
          ],
          "status": 4
        }
      "@
      #$($env:env:SYSTEM_PULLREQUEST_PULLREQUESTID)
      $url = "$($env:SYSTEM_TEAMFOUNDATIONCOLLECTIONURI)$env:SYSTEM_TEAMPROJECTID/_apis/git/repositories/$($env:BUILD_REPOSITORY_NAME)/pullRequests/1/threads?api-version=5.1"
      Write-Host $url
      $result = Invoke-RestMethod -Uri $url -Method POST -Headers @{Authorization = "Bearer $(System.AccessToken)"} -Body $Body -ContentType application/json

  displayName: Post comment on PR
- task: HCLAppScanOnCloud@2
  inputs:
    AppSecTestService: 'ASoC'
    applications: '93704532-4ae4-4148-9af3-44e8111c492a'
    scantype: 'static'
    scanMethod: 'IRX'
    includeSCA: false
    ScanSpeedOptions: 'simple'
    FailBuildConfiguration: true

